name: Collect real CBG market data
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cbg-market-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add the DATABASE_URL repository secret before running collection."
            exit 1
          fi
      - name: Initialize idempotent database schema
        run: npm run db:migrate
      - name: Collect public market pages and save checkpoints
        run: npm run collect

      - name: Enforce row caps and run cleanup when 72 hours have elapsed
        if: always()
        run: npm run db:maintain
