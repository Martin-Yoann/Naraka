name: Collect real CBG market data
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cbg-market-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOTTERY_UPCOMING_HOURS: ${{ vars.LOTTERY_UPCOMING_HOURS || '6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add the DATABASE_URL repository secret before running collection."
            exit 1
          fi
      - name: Initialize idempotent database schema
        run: npm run db:migrate
      - name: Discover limited lottery candidates and verify current or upcoming windows
        run: npm run collect

      - name: Match account lottery preferences against fresh confirmed observations
        if: always()
        env:
          SITE_ORIGIN: https://www.gekiyan.com
          WECHAT_OA_SANDBOX: 'true'
          WECHAT_OA_APP_ID: ${{ secrets.WECHAT_OA_APP_ID }}
          WECHAT_OA_APP_SECRET: ${{ secrets.WECHAT_OA_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_TEMPLATE_FIELDS: ${{ secrets.WECHAT_TEMPLATE_FIELDS }}
          WECHAT_SEND_ENABLED: ${{ vars.WECHAT_SEND_ENABLED }}
        run: node scripts/evaluate-preferences.mjs

      - name: Enforce row caps and run cleanup when 72 hours have elapsed
        if: always()
        run: npm run db:maintain
