name: Check favorite lottery openings
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: favorite-lottery-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_ORIGIN: https://www.gekiyan.com
      WECHAT_OA_SANDBOX: 'true'
      WECHAT_OA_APP_ID: ${{ secrets.WECHAT_OA_APP_ID }}
      WECHAT_OA_APP_SECRET: ${{ secrets.WECHAT_OA_APP_SECRET }}
      WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
      WECHAT_TEMPLATE_FIELDS: ${{ secrets.WECHAT_TEMPLATE_FIELDS }}
      WECHAT_SEND_ENABLED: ${{ vars.WECHAT_SEND_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Recheck only due favorited items, then enqueue deduplicated opening messages
        run: node scripts/check-favorites.mjs
